# Builds MoneyPi for Windows, macOS and Linux, signs the update files, checks that nothing is missing and only then
# publishes the release (it stays a draft until every check passes, so users never see a half-built release).
#
# Run it either way:
#   1. push a tag:           git tag v0.17.0 && git push origin v0.17.0
#   2. Actions -> Release -> Run workflow, version "0.17.0"
#
# Jobs: prepare (checks, creates the draft) -> build (Windows, macOS universal, Linux at the same time, each uploads its
# files to the draft) -> publish (one latest.json for every platform, made from the uploaded signatures; asset check;
# notes; publish; preview feed) -> android (APK attached to the published release).
#
# Two channels: "0.22.0" is a stable release (what everybody gets), "0.22.0-preview.1" is a preview: a GitHub pre-release
# that only people who chose the preview channel in Settings are offered. A preview skips the formats that cannot carry a
# "-preview.1" version (Windows MSI, Linux rpm), and the preview feed (release "preview-channel", its latest.json) is
# moved to the newest build, stable or preview, so the desktop app on the preview channel finds it.
# macOS builds are ad-hoc signed (no Apple developer certificate), so the first launch needs "Open Anyway".
# Needs the repository secret TAURI_SIGNING_PRIVATE_KEY (contents of the updater private key file) and, only if the
# key has a password, TAURI_SIGNING_PRIVATE_KEY_PASSWORD. The notes live in release-notes/v<version>.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.17.0 or a preview 0.22.0-preview.1 (must match tauri.conf.json, package.json and Cargo.toml)"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      pre: ${{ steps.ver.outputs.pre }}
      release_id: ${{ steps.draft.outputs.id }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version and check the repository is ready
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then V="$INPUT_VERSION"; else V="$GITHUB_REF_NAME"; fi
          V="${V#v}"
          node .github/scripts/version.mjs valid "$V" || { echo "::error::version must look like 0.22.0 or 0.22.0-preview.1, not '$V'"; exit 1; }
          PRE=$(node .github/scripts/version.mjs pre "$V")
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "PRE=$PRE" >> "$GITHUB_ENV"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "pre=$PRE" >> "$GITHUB_OUTPUT"

          [ -n "$SIGNING_KEY" ] || { echo "::error::Repository secret TAURI_SIGNING_PRIVATE_KEY is not set"; exit 1; }

          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          cargo=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          for pair in "tauri.conf.json=$conf" "package.json=$pkg" "Cargo.toml=$cargo"; do
            [ "${pair#*=}" = "$V" ] || { echo "::error::${pair%%=*} says ${pair#*=}, but releasing $V"; exit 1; }
          done

          notes="release-notes/v$V.md"
          [ -s "$notes" ] || { echo "::error::$notes is missing or empty - write the release notes first"; exit 1; }

      # One draft for all three builds to upload into (three builds creating it themselves could make three drafts).
      # A draft left over from a failed run of the same version is reused; a published one is never touched.
      - name: Create the draft release
        id: draft
        run: |
          set -euo pipefail
          # "<id> <draft>" of the release for this tag, or nothing. Drafts have no tag yet, so only the list shows them.
          lookup() { gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"v$VERSION\") | \"\(.id) \(.draft)\"" | head -1; }
          found=$(lookup)
          if [ -z "$found" ]; then
            # The list can lag a few seconds behind a new release, so take the id from the create call itself.
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="v$VERSION" -f target_commitish="$GITHUB_SHA" -f name="MoneyPi v$VERSION" -f body="建置中…" \
              -F draft=true -F prerelease="$PRE" --jq .id)
          else
            id=${found% *}
            [ "${found#* }" = "true" ] || { echo "::error::v$VERSION is already published"; exit 1; }
            # A leftover draft still points at the commit of the failed run; the tag must land on this one.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -f target_commitish="$GITHUB_SHA" -F prerelease="$PRE" --silent
          fi
          [[ "$id" =~ ^[0-9]+$ ]] || { echo "::error::could not create or find the draft release v$VERSION (got '$id')"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "draft release v$VERSION: id $id"

  build:
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-22.04
            name: Linux
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PRE: ${{ needs.prepare.outputs.pre }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # macOS: one universal app for Intel and Apple-chip Macs
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - run: npm ci

      # Fetch via the official GitHub API when the browser download endpoint times out.
      # Hash pinned by tauri-cli 2.12.4's tauri-bundler Windows MSI implementation.
      - name: Prepare verified WiX toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'wix314-binaries.zip'
          gh release download wix3141rtm --repo wixtoolset/wix3 --pattern wix314-binaries.zip --dir $env:RUNNER_TEMP --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Unable to download official WiX toolchain' }
          $expected = '6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'WiX SHA-256 verification failed'
          }
          $tools = Join-Path $env:LOCALAPPDATA 'tauri/WixTools314'
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          Expand-Archive -Path $archive -DestinationPath $tools -Force

      - name: Prepare verified NSIS toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          gh release download nsis-3.13 --repo tauri-apps/binary-releases --pattern nsis-3.13.zip --dir $env:RUNNER_TEMP --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Unable to download official NSIS toolchain' }
          $archive = Join-Path $env:RUNNER_TEMP 'nsis-3.13.zip'
          if ((Get-FileHash $archive -Algorithm SHA1).Hash -ne 'DB14F8AF2EA346B786C6AE19343F61AAF5E09B8E') {
            throw 'NSIS checksum verification failed'
          }
          $cache = Join-Path $env:LOCALAPPDATA 'tauri'
          Expand-Archive -Path $archive -DestinationPath $cache -Force
          $tools = Join-Path $cache 'NSIS'
          if (Test-Path $tools) { Remove-Item -Recurse -Force $tools }
          Move-Item (Join-Path $cache 'nsis-3.13') $tools
          gh release download nsis_tauri_utils-v0.5.3 --repo tauri-apps/nsis-tauri-utils --pattern nsis_tauri_utils.dll --dir $env:RUNNER_TEMP --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Unable to download official NSIS plugin' }
          $plugin = Join-Path $env:RUNNER_TEMP 'nsis_tauri_utils.dll'
          if ((Get-FileHash $plugin -Algorithm SHA1).Hash -ne '75197FEE3C6A814FE035788D1C34EAD39349B860') {
            throw 'NSIS plugin checksum verification failed'
          }
          $plugins = Join-Path $tools 'Plugins/x86-unicode/additional'
          New-Item -ItemType Directory -Force -Path $plugins | Out-Null
          Copy-Item $plugin $plugins -Force

      # Which files each platform builds. A preview skips the formats whose version field cannot hold "-preview.1".
      - name: Choose what to build
        id: what
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Windows) [ "$PRE" = "true" ] && a="--bundles nsis" || a="" ;;
            macOS)   a="--target universal-apple-darwin --bundles app,dmg" ;;
            Linux)   [ "$PRE" = "true" ] && a="--bundles deb,appimage" || a="--bundles deb,rpm,appimage" ;;
          esac
          echo "args=$a" >> "$GITHUB_OUTPUT"
          echo "$RUNNER_OS: tauri build $a"

      - name: Build, sign and upload to the draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ steps.what.outputs.args }}
          # the publish job writes the real latest.json for every platform from the uploaded signatures
          includeUpdaterJson: false

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PRE: ${{ needs.prepare.outputs.pre }}
      # Everything below goes through the release id: a draft has no tag yet, so `gh release ... v<version>` cannot find it.
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
    steps:
      - uses: actions/checkout@v5

      - name: Check that nothing is missing and write latest.json for every platform
        run: |
          set -euo pipefail
          R="repos/$GITHUB_REPOSITORY/releases"
          gh api "$R/$RELEASE_ID/assets?per_page=100" > "$RUNNER_TEMP/list.json"
          node -e 'const l=require(process.argv[1]); require("fs").writeFileSync(process.argv[2], JSON.stringify({assets: l}))' \
            "$RUNNER_TEMP/list.json" "$RUNNER_TEMP/assets.json"
          mkdir -p "$RUNNER_TEMP/sigs"
          jq -r '.[] | select(.name | endswith(".sig")) | "\(.id) \(.name)"' "$RUNNER_TEMP/list.json" | while read -r aid name; do
            gh api -H "Accept: application/octet-stream" "$R/assets/$aid" > "$RUNNER_TEMP/sigs/$name"
          done
          ls -l "$RUNNER_TEMP/sigs"
          node .github/scripts/release-body.mjs "$VERSION" "release-notes/v$VERSION.md" "$RUNNER_TEMP"
          node .github/scripts/updater-json.mjs "$VERSION" "$RUNNER_TEMP/update-notes.md" "$RUNNER_TEMP/assets.json" "$RUNNER_TEMP/sigs" "$RUNNER_TEMP/latest.json" "$GITHUB_REPOSITORY"
          # replace a latest.json left by an earlier attempt, then upload this one
          jq -r '.[] | select(.name == "latest.json") | .id' "$RUNNER_TEMP/list.json" | while read -r aid; do gh api -X DELETE "$R/assets/$aid"; done
          gh api -X POST "https://uploads.github.com/$R/$RELEASE_ID/assets?name=latest.json" \
            -H "Content-Type: application/json" --input "$RUNNER_TEMP/latest.json" --jq '"uploaded \(.name) (\(.size) bytes)"'
          gh api "$R/$RELEASE_ID/assets?per_page=100" --jq '.[].name'

      - name: Write the notes and publish
        run: |
          set -euo pipefail
          # a preview is a pre-release and never "the latest release" (that is what stable users and the stable updater follow)
          if [ "$PRE" = "true" ]; then title="MoneyPi v$VERSION (preview)"; latest=false; else title="MoneyPi v$VERSION"; latest=true; fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -f tag_name="v$VERSION" -f name="$title" \
            -F body=@"$RUNNER_TEMP/release-body.md" -F draft=false -F prerelease="$PRE" -f make_latest="$latest" \
            --jq '"published \(.tag_name): draft=\(.draft) prerelease=\(.prerelease) \(.html_url)"'

      # The preview feed: one fixed release ("preview-channel") whose latest.json always describes the newest build (preview or
      # stable), because GitHub has no "latest including pre-releases" address. Required for a preview; for a stable release it
      # must never be able to block publishing (it already is public at this point), so a failure there only shows as a warning.
      - name: Move the preview feed to this build
        continue-on-error: ${{ env.PRE != 'true' }}
        run: |
          set -euo pipefail
          FEED=preview-channel
          mkdir -p "$RUNNER_TEMP/feed-new" "$RUNNER_TEMP/feed-cur"
          cp "$RUNNER_TEMP/latest.json" "$RUNNER_TEMP/feed-new/latest.json"
          if ! gh release view "$FEED" >/dev/null 2>&1; then
            gh release create "$FEED" --prerelease --latest=false --target "$GITHUB_SHA" --title "Preview channel (update feed only)" \
              --notes "Not a download. This release only holds latest.json, which the app's preview update channel reads. Get MoneyPi from the versioned releases."
          fi
          CUR=""
          if gh release download "$FEED" --pattern latest.json --dir "$RUNNER_TEMP/feed-cur" --clobber 2>/dev/null; then
            CUR=$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).version" "$RUNNER_TEMP/feed-cur/latest.json" 2>/dev/null || true)
          fi
          if node .github/scripts/version.mjs newer "$VERSION" "$CUR"; then
            gh release upload "$FEED" "$RUNNER_TEMP/feed-new/latest.json" --clobber
            echo "preview feed: ${CUR:-empty} -> $VERSION"
          else
            echo "preview feed stays at $CUR (newer than $VERSION)"
          fi

  # the Android app is built after the desktop release is public and attached to it (its own signing key, see android.yml)
  android:
    needs: [prepare, publish]
    uses: ./.github/workflows/android.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit
