# Builds the Windows installers, signs them for the in-app updater, checks that nothing is missing and only then
# publishes the release (it stays a draft until every check passes, so users never see a half-built release).
#
# Run it either way:
#   1. push a tag:           git tag v0.17.0 && git push origin v0.17.0
#   2. Actions -> Release -> Run workflow, version "0.17.0"
#
# Two channels: "0.22.0" is a stable release (what everybody gets), "0.22.0-preview.1" is a preview: a GitHub pre-release
# that only people who chose the preview channel in Settings are offered. A preview is built as the NSIS installer only (the
# MSI format cannot carry a "-preview.1" version), and the preview feed (release "preview-channel", its latest.json) is
# moved to the newest build, stable or preview, so the desktop app on the preview channel finds it.
# Needs the repository secret TAURI_SIGNING_PRIVATE_KEY (contents of the updater private key file) and, only if the
# key has a password, TAURI_SIGNING_PRIVATE_KEY_PASSWORD. The notes live in release-notes/v<version>.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.17.0 or a preview 0.22.0-preview.1 (must match tauri.conf.json, package.json and Cargo.toml)"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version and check the repository is ready
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then V="$INPUT_VERSION"; else V="$GITHUB_REF_NAME"; fi
          V="${V#v}"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          node .github/scripts/version.mjs valid "$V" || { echo "::error::version must look like 0.22.0 or 0.22.0-preview.1, not '$V'"; exit 1; }
          PRE=$(node .github/scripts/version.mjs pre "$V")
          echo "PRE=$PRE" >> "$GITHUB_ENV"

          [ -n "$SIGNING_KEY" ] || { echo "::error::Repository secret TAURI_SIGNING_PRIVATE_KEY is not set"; exit 1; }

          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          cargo=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          for pair in "tauri.conf.json=$conf" "package.json=$pkg" "Cargo.toml=$cargo"; do
            [ "${pair#*=}" = "$V" ] || { echo "::error::${pair%%=*} says ${pair#*=}, but releasing $V"; exit 1; }
          done

          notes="release-notes/v$V.md"
          [ -s "$notes" ] || { echo "::error::$notes is missing or empty - write the release notes first"; exit 1; }

          # release body = notes + the standard install section (so no release ships without it);
          # the updater prompt (latest.json "notes") gets just the notes
          node - "$V" "$notes" "$RUNNER_TEMP" <<'JS'
          const fs = require("fs");
          const [v, file, tmp] = process.argv.slice(2);
          const notes = fs.readFileSync(file, "utf8").replace(/\r\n/g, "\n").trim();
          const pre = v.includes("-");
          const body = (pre ? [
            "> ⚠️ **這是預覽版（preview）**：提早試用新功能，可能還有沒修好的問題。只有在「設定 → 版本 → 更新頻道」選了「預覽版」的人才會收到更新提示；一般使用者不會被推送。重要資料請先匯出備份。",
            "",
            notes,
            "",
            "### 安裝與更新",
            "- 電腦版：選了「預覽版」頻道的使用者會在啟動時收到更新提示；也可以手動安裝 `MoneyPi_" + v + "_x64-setup.exe`（預覽版只提供這個安裝檔）",
            "- 手機版（Android）：下載下面的 APK 安裝，或在「設定 → 版本」選「預覽版」頻道後按「檢查更新」",
            "- 安裝檔未經程式碼簽章，Windows SmartScreen 可能會提示，請選「更多資訊 → 仍要執行」",
            "",
          ] : [
            notes,
            "",
            "### 安裝與更新",
            "- 已安裝 v0.13.0 以上的使用者會在啟動時收到更新提示，一鍵更新",
            "- v0.12.0 以前的使用者請先手動安裝一次（簽章金鑰已更換）",
            "- 手動安裝：`MoneyPi_" + v + "_x64-setup.exe`（建議）或 `MoneyPi_" + v + "_x64_en-US.msi`",
            "- 安裝檔未經程式碼簽章，Windows SmartScreen 可能會提示，請選「更多資訊 → 仍要執行」",
            "",
          ]).join("\n");
          fs.writeFileSync(tmp + "/release-body.md", body);
          fs.writeFileSync(tmp + "/update-notes.md", notes + "\n");
          JS

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Fetch via the official GitHub API when the browser download endpoint times out.
      # Hash pinned by tauri-cli 2.12.4's tauri-bundler Windows MSI implementation.
      - name: Prepare verified WiX toolchain
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'wix314-binaries.zip'
          gh release download wix3141rtm --repo wixtoolset/wix3 --pattern wix314-binaries.zip --dir $env:RUNNER_TEMP --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Unable to download official WiX toolchain' }
          $expected = '6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'WiX SHA-256 verification failed'
          }
          $tools = Join-Path $env:LOCALAPPDATA 'tauri/WixTools314'
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          Expand-Archive -Path $archive -DestinationPath $tools -Force

      - name: Prepare verified NSIS toolchain
        shell: pwsh
        run: |
          gh release download nsis-3.13 --repo tauri-apps/binary-releases --pattern nsis-3.13.zip --dir $env:RUNNER_TEMP --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Unable to download official NSIS toolchain' }
          $archive = Join-Path $env:RUNNER_TEMP 'nsis-3.13.zip'
          if ((Get-FileHash $archive -Algorithm SHA1).Hash -ne 'DB14F8AF2EA346B786C6AE19343F61AAF5E09B8E') {
            throw 'NSIS checksum verification failed'
          }
          $cache = Join-Path $env:LOCALAPPDATA 'tauri'
          Expand-Archive -Path $archive -DestinationPath $cache -Force
          $tools = Join-Path $cache 'NSIS'
          if (Test-Path $tools) { Remove-Item -Recurse -Force $tools }
          Move-Item (Join-Path $cache 'nsis-3.13') $tools
          gh release download nsis_tauri_utils-v0.5.3 --repo tauri-apps/nsis-tauri-utils --pattern nsis_tauri_utils.dll --dir $env:RUNNER_TEMP --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Unable to download official NSIS plugin' }
          $plugin = Join-Path $env:RUNNER_TEMP 'nsis_tauri_utils.dll'
          if ((Get-FileHash $plugin -Algorithm SHA1).Hash -ne '75197FEE3C6A814FE035788D1C34EAD39349B860') {
            throw 'NSIS plugin checksum verification failed'
          }
          $plugins = Join-Path $tools 'Plugins/x86-unicode/additional'
          New-Item -ItemType Directory -Force -Path $plugins | Out-Null
          Copy-Item $plugin $plugins -Force

      - name: Build, sign and upload to a draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ env.VERSION }}
          releaseName: MoneyPi v${{ env.VERSION }}
          releaseCommitish: ${{ github.sha }}
          releaseDraft: true
          prerelease: ${{ env.PRE == 'true' }}
          args: ${{ env.PRE == 'true' && '--bundles nsis' || '' }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Put the update notes into latest.json
        run: |
          set -euo pipefail
          gh release download "v$VERSION" --pattern latest.json --dir "$RUNNER_TEMP" --clobber
          node - "$RUNNER_TEMP" <<'JS'
          const fs = require("fs");
          const t = process.argv[2];
          const j = JSON.parse(fs.readFileSync(t + "/latest.json", "utf8"));
          j.notes = fs.readFileSync(t + "/update-notes.md", "utf8").trim();
          fs.writeFileSync(t + "/latest.json", JSON.stringify(j, null, 2) + "\n");
          JS
          gh release upload "v$VERSION" "$RUNNER_TEMP/latest.json" --clobber

      - name: Check that nothing is missing
        run: |
          set -euo pipefail
          V="$VERSION"
          gh release view "v$V" --json assets,isDraft > "$RUNNER_TEMP/release.json"
          node - "$V" "$RUNNER_TEMP/release.json" <<'JS'
          const [v, file] = process.argv.slice(2);
          const r = JSON.parse(require("fs").readFileSync(file, "utf8"));
          const have = new Set(r.assets.map((a) => a.name));
          const pre = v.includes("-"); // a preview ships the NSIS installer only
          const need = [`MoneyPi_${v}_x64-setup.exe`, `MoneyPi_${v}_x64-setup.exe.sig`, ...(pre ? [] : [`MoneyPi_${v}_x64_en-US.msi`, `MoneyPi_${v}_x64_en-US.msi.sig`]), "latest.json"];
          const missing = need.filter((n) => !have.has(n));
          if (missing.length) { console.log("::error::Missing release assets: " + missing.join(", ")); process.exit(1); }
          console.log("assets ok:", need.join(", "));
          JS
          gh release download "v$V" --pattern latest.json --dir "$RUNNER_TEMP" --clobber
          node - "$V" "$RUNNER_TEMP/latest.json" <<'JS'
          const [v, file] = process.argv.slice(2);
          const j = JSON.parse(require("fs").readFileSync(file, "utf8"));
          const p = j.platforms && j.platforms["windows-x86_64"];
          if (!j.notes || !j.notes.trim()) { console.log("::error::latest.json has no update notes"); process.exit(1); }
          if (j.version !== v) { console.log(`::error::latest.json version ${j.version} != ${v}`); process.exit(1); }
          if (!p || !p.signature || !p.url.endsWith(`MoneyPi_${v}_x64-setup.exe`)) { console.log("::error::latest.json has no valid windows-x86_64 entry"); process.exit(1); }
          console.log("latest.json ok");
          JS

      - name: Write the notes and publish
        run: |
          set -euo pipefail
          if [ "$PRE" = "true" ]; then
            # a preview is a pre-release and never "the latest release" (that is what stable users and the stable updater follow)
            gh release edit "v$VERSION" --title "MoneyPi v$VERSION (preview)" --notes-file "$RUNNER_TEMP/release-body.md" --draft=false --prerelease --latest=false
          else
            gh release edit "v$VERSION" --title "MoneyPi v$VERSION" --notes-file "$RUNNER_TEMP/release-body.md" --draft=false --prerelease=false --latest
          fi

      # The preview feed: one fixed release ("preview-channel") whose latest.json always describes the newest build (preview or
      # stable), because GitHub has no "latest including pre-releases" address. Required for a preview; for a stable release it
      # must never be able to block publishing (it already is public at this point), so a failure there only shows as a warning.
      - name: Move the preview feed to this build
        continue-on-error: ${{ env.PRE != 'true' }}
        run: |
          set -euo pipefail
          FEED=preview-channel
          mkdir -p "$RUNNER_TEMP/feed-new" "$RUNNER_TEMP/feed-cur"
          gh release download "v$VERSION" --pattern latest.json --dir "$RUNNER_TEMP/feed-new" --clobber
          if ! gh release view "$FEED" >/dev/null 2>&1; then
            gh release create "$FEED" --prerelease --latest=false --target "$GITHUB_SHA" --title "Preview channel (update feed only)" \
              --notes "Not a download. This release only holds latest.json, which the app's preview update channel reads. Get MoneyPi from the versioned releases."
          fi
          CUR=""
          if gh release download "$FEED" --pattern latest.json --dir "$RUNNER_TEMP/feed-cur" --clobber 2>/dev/null; then
            CUR=$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).version" "$RUNNER_TEMP/feed-cur/latest.json" 2>/dev/null || true)
          fi
          if node .github/scripts/version.mjs newer "$VERSION" "$CUR"; then
            gh release upload "$FEED" "$RUNNER_TEMP/feed-new/latest.json" --clobber
            echo "preview feed: ${CUR:-empty} -> $VERSION"
          else
            echo "preview feed stays at $CUR (newer than $VERSION)"
          fi

  # the Android app is built after the Windows release is public and attached to it (its own signing key, see android.yml)
  android:
    needs: release
    uses: ./.github/workflows/android.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
