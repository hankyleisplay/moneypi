# Builds the Android app (APK), signs it with the repository's release key and attaches it to the GitHub release.
#
# Run it from Actions -> Android APK -> Run workflow (version = the release it belongs to, e.g. 0.20.0), or let
# release.yml call it. Needs the repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and
# ANDROID_KEY_ALIAS. The same key must be used for every version: Android only installs an update over an app
# signed with the same key, and uninstalling instead would delete the phone's data.
name: Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.20.0 or a preview 0.22.0-preview.1 (must match tauri.conf.json, package.json and Cargo.toml)"
        required: true
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the version and the signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          V="${VERSION#v}"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          for n in KEYSTORE_B64 KEYSTORE_PW KEY_ALIAS; do
            [ -n "${!n}" ] || { echo "::error::Repository secret for $n is not set (ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS)"; exit 1; }
          done

          # Check the key now, not after the 8-minute build. The expected size and certificate fingerprint are not secret;
          # they make sure this is the MoneyPi release key (a different key would make phones refuse the update).
          # If the key is ever replaced on purpose, update these two values. (It is an EC key on purpose: its base64 text is
          # only ~1,350 characters, short enough to paste into a phone's text field, which cut the earlier RSA key at 2,000.)
          EXPECTED_SIZE=1014
          EXPECTED_FP="C4:8F:E9:AE:7A:49:72:04:CF:B2:CA:99:8C:F5:45:98:31:25:0E:A7:3F:0D:81:31:AE:46:5B:18:8D:2D:3B:AB"
          B64=$(printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t')
          printf '%s' "$B64" | base64 -d > "$RUNNER_TEMP/check.jks" 2>/dev/null || { echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64 (pasted ${#B64} characters)"; exit 1; }
          SIZE=$(wc -c < "$RUNNER_TEMP/check.jks")
          if [ "$SIZE" != "$EXPECTED_SIZE" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is incomplete: ${#B64} characters pasted, decoded to $SIZE bytes, expected $EXPECTED_SIZE bytes. Paste the whole content of keystore.base64.txt again (no spaces or line breaks; it ends with the same characters it was given with)."
            rm -f "$RUNNER_TEMP/check.jks"; exit 1
          fi
          keytool -list -v -keystore "$RUNNER_TEMP/check.jks" -storepass "$KEYSTORE_PW" -alias "$KEY_ALIAS" > "$RUNNER_TEMP/check.txt" 2>&1 \
            || { echo "::error::cannot read the key: ANDROID_KEYSTORE_PASSWORD or ANDROID_KEY_ALIAS is wrong"; rm -f "$RUNNER_TEMP/check.jks"; exit 1; }
          FP=$(grep -m1 "SHA256:" "$RUNNER_TEMP/check.txt" | sed 's/.*SHA256: *//' | tr -d '[:space:]')
          rm -f "$RUNNER_TEMP/check.jks" "$RUNNER_TEMP/check.txt"
          [ "$FP" = "$EXPECTED_FP" ] || { echo "::error::this key's certificate fingerprint ($FP) is not the MoneyPi release key ($EXPECTED_FP)"; exit 1; }
          echo "Signing key OK ($SIZE bytes, fingerprint matches)"
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          cargo=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          for pair in "tauri.conf.json=$conf" "package.json=$pkg" "Cargo.toml=$cargo"; do
            [ "${pair#*=}" = "$V" ] || { echo "::error::${pair%%=*} says ${pair#*=}, but building $V"; exit 1; }
          done

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Generate the Android project
        run: |
          set -euo pipefail
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android init --ci
          # MoneyPi's own pieces on top of the generated project: launcher icons (made from src-tauri/icons/icon.png),
          # the home-screen widget (Kotlin + resources + its <receiver>) and a MainActivity that refreshes it
          node .github/scripts/android-extras.mjs
          grep -q "NetWorthWidget" src-tauri/gen/android/app/src/main/AndroidManifest.xml || { echo "::error::widget receiver missing from the manifest"; exit 1; }

      # Tauri derives versionCode from major.minor.patch only, which would give a preview and its stable release the same code.
      # version.mjs makes it grow with every release and puts a stable release above its previews (see the comments there).
      - name: Build the APK (64-bit and 32-bit phones)
        run: |
          set -euo pipefail
          node .github/scripts/version.mjs valid "$VERSION" || { echo "::error::version must look like 0.22.0 or 0.22.0-preview.1"; exit 1; }
          VC=$(node .github/scripts/version.mjs code "$VERSION")
          echo "VERSION_CODE=$VC" >> "$GITHUB_ENV"
          echo "versionCode $VC for $VERSION"
          npx tauri android build --apk --target aarch64 --target armv7 --ci --config "{\"bundle\":{\"android\":{\"versionCode\":$VC}}}"

      - name: Sign, align and verify
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(find src-tauri/gen/android -name '*-unsigned.apk' | head -1)
          [ -n "$UNSIGNED" ] || { echo "::error::no unsigned APK was produced"; find src-tauri/gen/android -name '*.apk'; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          OUT="MoneyPi_${VERSION}_android.apk"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PW --key-pass env:KEYSTORE_PW --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$OUT" | tee "$RUNNER_TEMP/cert.txt"
          rm -f "$RUNNER_TEMP/release.jks"
          sha256sum "$OUT" > "$OUT.sha256"
          ls -la "$OUT"
          # the app must carry the version we are releasing
          "$BT/aapt2" dump badging "$OUT" | grep -E "^package:" | tee "$RUNNER_TEMP/badging.txt"
          grep -q "versionName='$VERSION'" "$RUNNER_TEMP/badging.txt" || { echo "::error::APK versionName is not $VERSION"; exit 1; }
          grep -q "versionCode='$VERSION_CODE'" "$RUNNER_TEMP/badging.txt" || { echo "::error::APK versionCode is not $VERSION_CODE"; exit 1; }

      - uses: actions/upload-artifact@v6
        with:
          name: MoneyPi_${{ env.VERSION }}_android
          path: |
            MoneyPi_${{ env.VERSION }}_android.apk
            MoneyPi_${{ env.VERSION }}_android.apk.sha256

      - name: Attach to the release
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "MoneyPi_${VERSION}_android.apk" "MoneyPi_${VERSION}_android.apk.sha256" --clobber
            # say so in the release notes (once)
            gh release view "v$VERSION" --json body -q .body > "$RUNNER_TEMP/body.md"
            if ! grep -q "_android.apk" "$RUNNER_TEMP/body.md"; then
              printf '%s\n' "- 手機版（Android 7.0 以上）：\`MoneyPi_${VERSION}_android.apk\`。下載後安裝，第一次需要允許「安裝未知來源的應用程式」。已安裝舊版時直接安裝新版即可更新，資料會保留。" >> "$RUNNER_TEMP/body.md"
              gh release edit "v$VERSION" --notes-file "$RUNNER_TEMP/body.md"
            fi
            echo "Attached to release v$VERSION"
          else
            echo "::warning::release v$VERSION does not exist yet; the APK is only available as a workflow artifact"
          fi
